<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Necronlabs | Resistor Calculator</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=VT323&family=Silkscreen:wght@400;700&family=DotGothic16&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="index.css">
    
    <style>
        header {
            background: rgba(15, 15, 17, 0.92) !important;
            backdrop-filter: blur(12px) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
            padding: 0.75rem 4vw !important;
        }
        .terminal-body input, .terminal-body select, .terminal-body button {
            background: #1f1f23;
            color: #fff;
            border: 1px solid var(--surface-color);
            padding: 0.4rem 0.6rem;
            border-radius: 4px;
            font-family: var(--font-body);
        }
        .terminal-body button {
            cursor: pointer;
            border-color: var(--accent-red);
            color: var(--accent-red);
            transition: all 0.2s ease;
        }
        .terminal-body button:hover {
            background: rgba(201, 24, 43, 0.2);
        }
        .calc-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-top: 1.5rem;
        }
        .band-selector {
            margin-bottom: 1.5rem;
        }
        .band-selector h4 {
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }
        .color-radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .color-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            background: #2a2a2f;
            border: 1px solid transparent;
            font-size: 0.9rem;
            user-select: none;
            color: #fff;
        }
        .color-label:hover {
            border-color: #555;
        }
        input[type="radio"] {
            display: none;
        }
        input[type="radio"]:checked + .color-label {
            border-color: var(--accent-red);
            background: rgba(201, 24, 43, 0.2);
            box-shadow: 0 0 8px rgba(201,24,43,0.4);
        }
        .color-box {
            width: 16px;
            height: 16px;
            border-radius: 2px;
            border: 1px solid rgba(255,255,255,0.3);
        }
        
        /* Color Code Colors */
        .c-black { background-color: #000000; }
        .c-brown { background-color: #8B4513; }
        .c-red { background-color: #FF0000; }
        .c-orange { background-color: #FFA500; }
        .c-yellow { background-color: #FFFF00; color: #000; }
        .c-green { background-color: #008000; }
        .c-blue { background-color: #0000FF; }
        .c-violet { background-color: #EE82EE; }
        .c-grey { background-color: #808080; }
        .c-white { background-color: #FFFFFF; }
        .c-gold { background-color: #FFD700; }
        .c-silver { background-color: #C0C0C0; }
        .c-none { background-color: transparent; border: 1px dashed #fff; }

        /* SVG styling is inline */
        
        .resistor-display-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .output-box {
            background: #111;
            padding: 1.5rem;
            border: 1px solid var(--accent-red);
            border-radius: 8px;
            text-align: center;
            font-family: var(--font-pixel);
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 0 0 10px rgba(201,24,43,0.5);
            width: 100%;
        }

        /* Controls wrapper */
        .controls-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Hide/show logic */
        .mode-section {
            display: none;
        }
        .mode-section.active {
            display: block;
        }

        @media (max-width: 768px) {
            .calc-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="vanta-bg"></div>

    <!-- Header Full Width -->
    <header>
        <nav class="nav-links">
            <a href="index.html#home" class="gsap-link">Home</a>
            <a href="projects.html" class="gsap-link">Projects</a>
            <a href="tools.html" class="gsap-link active" style="color: var(--accent-color);">Tools</a>
            <a href="about.html" class="gsap-link">About Me</a>
            <a href="contact.html" class="gsap-link">Contact</a>
        </nav>
        <div class="header-right" style="display: flex; align-items: center; gap: 1.5rem;">
            <div class="logo">
                <a href="index.html"><img src="images/logo.jpg" alt="NecronLabs Logo"></a>
            </div>
        </div>
    </header>

    <div class="container" style="padding-top: 140px; min-height: 100vh;">
        <h1 class="section-title gsap-reveal" style="font-family: var(--font-pixel); font-size: clamp(2.5rem, 6vw, 4rem); color: var(--accent-red); margin-bottom: 2rem;">Resistor Calculator</h1>
        
        <div class="terminal-box gsap-card" style="margin-bottom: 4rem;">
            <div class="terminal-header">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
                <span class="terminal-title">~/tools/resistor_calc.exe</span>
            </div>
            <div class="terminal-body">
                
                <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1.5rem;">
                    <label style="font-weight: bold;">Calculator Type:</label>
                    <select id="calc-type" onchange="switchCalcType()">
                        <option value="color">Color Code (Through-hole)</option>
                        <option value="smd">SMD Code</option>
                    </select>
                </div>

                <!-- COLOR CODE SECTION -->
                <div id="section-color" class="mode-section active">
                    <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1.5rem;">
                        <label style="font-weight: bold;">Number of Bands:</label>
                        <select id="band-count" onchange="updateBandUI()">
                            <option value="4">4 Band</option>
                            <option value="5">5 Band</option>
                            <option value="6">6 Band</option>
                        </select>
                    </div>

                    <div class="calc-container">
                        <!-- Left Col: Band Selectors -->
                        <div class="controls-wrapper" id="band-controls">
                            <!-- Injected by JS -->
                        </div>

                        <!-- Right Col: Visualizer & Output -->
                        <div class="resistor-display-wrapper">
                            <svg viewBox="0 0 400 120" style="width: 100%; max-width: 400px; height: auto; margin-bottom: 2rem;">
                                <defs>
                                    <path id="resBody" d="M 70 20 L 90 20 L 100 30 L 300 30 L 310 20 L 330 20 Q 350 20 350 60 Q 350 100 330 100 L 310 100 L 300 90 L 100 90 L 90 100 L 70 100 Q 50 100 50 60 Q 50 20 70 20 Z"/>
                                    <clipPath id="resClip">
                                        <use href="#resBody" />
                                    </clipPath>
                                    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                                        <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
                                        <stop offset="50%" stop-color="rgba(255,255,255,0)" />
                                        <stop offset="100%" stop-color="rgba(0,0,0,0.3)" />
                                    </linearGradient>
                                </defs>
                                <line x1="0" y1="60" x2="50" y2="60" stroke="#777" stroke-width="6"/>
                                <line x1="350" y1="60" x2="400" y2="60" stroke="#777" stroke-width="6"/>
                                <g clip-path="url(#resClip)">
                                    <use href="#resBody" fill="#e4d5b7" id="svg-resistor-bg" />
                                    <g id="resistor-graphic-bands"></g>
                                    <use href="#resBody" fill="url(#bodyGradient)" />
                                </g>
                                <use href="#resBody" fill="none" stroke="#222" stroke-width="2"/>
                            </svg>
                            <div class="output-box" id="color-output">
                                0 Ω ±0%
                            </div>
                            
                            <!-- Simple Reference Table -->
                            <div style="margin-top: 2rem; width: 100%; overflow-x: auto;">
                                <table style="width: 100%; text-align: center; border-collapse: collapse; font-size: 0.85rem;">
                                    <thead>
                                        <tr style="border-bottom: 1px solid var(--surface-color);">
                                            <th style="padding: 0.5rem;">Color</th>
                                            <th style="padding: 0.5rem;">Digit</th>
                                            <th style="padding: 0.5rem;">Multiplier</th>
                                            <th style="padding: 0.5rem;">Tolerance</th>
                                            <th style="padding: 0.5rem;">Temp Coeff</th>
                                        </tr>
                                    </thead>
                                    <tbody id="reference-table-body">
                                        <!-- Injected by JS -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SMD CODE SECTION -->
                <div id="section-smd" class="mode-section">
                    <div class="calc-container">
                        <div class="controls-wrapper">
                            <div style="margin-bottom: 1rem;">
                                <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">SMD Code:</label>
                                <input type="text" id="smd-code" placeholder="e.g. 103, 4R7, 01C" style="width: 100%; font-size: 1.2rem; text-transform: uppercase;" oninput="calculateSMD()">
                            </div>
                            <p style="color: var(--text-secondary); font-size: 0.9rem;">
                                Supports 3-digit (e.g. 103), 4-digit (e.g. 1002), EIA-96 (e.g. 01C), and values with 'R' (e.g. 4R7, R01).
                            </p>
                        </div>
                        <div class="resistor-display-wrapper">
                            <div class="output-box" id="smd-output">
                                ---
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer style="margin-top: 2rem;">
        <p>&copy; 2026 Necronlabs. All rights reserved.</p>
    </footer>

    <!-- Three.js and Vanta.js for Globe Effect -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>
    <!-- Motion for Animations -->
    <script src="https://cdn.jsdelivr.net/npm/motion@11.11.13/dist/motion.js"></script>
    <!-- Custom JS -->
    <script src="main.js"></script>
    <script src="js/resistor-calculator.js"></script>
</body>
</html>
