        <!-- Contact Section -->
        <section class="projects">
            <h1 class="section-title gsap-reveal" style="font-family: var(--font-pixel); font-size: clamp(3rem, 8vw, 5rem); color: var(--accent-red); margin-bottom: 3rem; text-align: center; justify-content: center;">SECURE COMMS</h1>
            
            <div class="contact-container gsap-reveal" style="max-width: 600px; margin: 0 auto;">
                <div class="terminal-box">
                    <div class="terminal-header">
                        <span class="dot red"></span>
                        <span class="dot yellow"></span>
                        <span class="dot green"></span>
                        <span class="terminal-title">necronlabs@host: ~/contact</span>
                    </div>
                    <div class="terminal-body" style="font-family: 'VT323', monospace; font-size: 1.5rem; color: #a1a1aa;">
                        <p><span style="color: var(--accent-red);">></span> Establishing secure connection...</p>
                        <p><span style="color: var(--accent-red);">></span> Connection established.</p>
                        <br>
                        
                        <div class="contact-links" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem;">
                            
                            <a href="mailto:necronlabs@gmail.com" class="contact-item">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent-red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>

                            <a href="https://github.com/necronlabs" target="_blank" class="contact-item">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent-red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
                                <span>github.com/necronlabs</span>
                            </a>
        
                            <a href="https://instagram.com/necronlabs" target="_blank" class="contact-item">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent-red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                                <span>@necronlabs</span>
                            </a>
                            
                            <a href="https://youtube.com/@necronlabs" target="_blank" class="contact-item">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent-red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33 2.78 2.78 0 0 0 1.94 2c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.33 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></svg>
